onboarding = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[worktrees]
directory = "~/.herdr/worktrees"

[keys]
prefix = "ctrl+g"
goto = "prefix+shift+g"
edit_scrollback = "prefix+shift+e"

# tmux-style direct chords (cmd = ⌘)
previous_tab = "cmd+h"
next_tab = "cmd+l"
previous_workspace = "cmd+j"
next_workspace = "cmd+k"
new_tab = "cmd+t"
close_tab = "cmd+w"
new_workspace = "cmd+shift+t"
zoom = "cmd+z"
rename_tab = "cmd+r"
copy_mode = "cmd+y"
rename_workspace = "cmd+shift+r"
close_workspace = "cmd+shift+w"
workspace_picker = "cmd+s"
focus_pane_left = "cmd+shift+h"
focus_pane_down = "cmd+shift+j"
focus_pane_up = "cmd+shift+k"
focus_pane_right = "cmd+shift+l"
cycle_pane_next = "cmd+p"

[ui]
confirm_close = true
prompt_new_tab_name = true
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["workspace"],
  ["state_icon", { token = "tab", fg = "#cdd6f4", bold = true }],
  ["agent"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  [{ token = "$project", fg = "#89b4fa", bold = true }],
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[session]
resume_agents_on_restore = true

[experimental]
allow_nested = false
pane_history = false

[ui.sound]
enabled = false

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+e"
type = "popup"
command = "nvim"
width = "80%"
height = "80%"
