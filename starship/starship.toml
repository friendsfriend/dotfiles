"$schema" = 'https://starship.rs/config-schema.json'

format = """
╭─ \
$os\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$fill\
$cmd_duration\
$kubernetes─╮\
$line_break\
╰─ \
$character\
"""
right_format = "─╯"
palette = "catppuccin_mocha"

[profiles]
transient = """
$character\
"""

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[fill]
symbol = "─"
style = ""

[cmd_duration]
style = "yellow"

[directory]
truncation_length = 5
truncation_symbol = "../"
truncate_to_repo = false
read_only = " 󰌾"
style = "blue"
repo_root_style = "sky bold"
substitutions = [
  { from = "^(.+)", to = " $1", regex = true },
  { from = "^ ~$", to = "󰋜 ~", regex = true },
]

[git_branch]
symbol = " "
style = "green bold"

[git_commit]
tag_symbol = '  '
tag_disabled = false

[git_state]
style = "mauve bold"

[git_status]
conflicted = "=${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "\\$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
style = "yellow"

[kubernetes]
disabled = false
symbol = "󱃾 "
format = '[$symbol$context( \($namespace\))]($style) '

[os]
disabled = false

